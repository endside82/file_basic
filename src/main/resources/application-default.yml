spring:
  config:
    activate:
      on-profile: default
  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 300MB
server:
  error:
    include-exception: false
    include-stacktrace: never
    path: '/file/error'
    whitelabel:
      enabled: false
  port: 38082
redis:
  host: ${REDIS_HOST:127.0.0.1}
  port: ${REDIS_PORT:6379}
  auth: ${REDIS_AUTH:false}
  password: ${REDIS_PASSWORD:}
  authentication:
    database: 0
  user:
    database: 1
  type: STANDARD
ssh:
  use: false
amazon:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    ec2policy: false
    profile-bucket:
      name: ${S3_PROFILE_BUCKET:your-profile-bucket}
    resource-bucket:
      name: ${S3_RESOURCE_BUCKET:your-resource-bucket}
    credentials:
      access-key: ${AWS_S3_ACCESS_KEY:your-access-key}
      secret-key: ${AWS_S3_SECRET_KEY:your-secret-key}
  image:
    path: images
  video:
    path: video
  common:
    path: common
jwt:
  secret: ${JWT_SECRET:your-jwt-secret-key-min-32-characters}
admin:
  verification-key: ${ADMIN_VERIFICATION_KEY:your-admin-key}
visible:
  stack:
    trace: true
logging:
  level:
    root: info
    web: info
